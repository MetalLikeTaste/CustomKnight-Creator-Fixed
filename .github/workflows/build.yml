name: Build CustomKnight Creator

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt6 Pillow PyInstaller

      - name: Build EXE
        run: |
          pyinstaller main.py -F -w -n "CustomKnight Creator" -i resources/SheoIcon.ico --add-data "resources;resources"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CustomKnight-Creator-Windows
          path: dist/CustomKnight Creator.exe
